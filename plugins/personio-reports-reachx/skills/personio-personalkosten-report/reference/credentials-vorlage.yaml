# REACHX Personio-Report — Credential-Vorlage
# =============================================
# Diese Datei nach  ~/.config/reachx-mta/personio.yaml  kopieren, ausfuellen
# und die Rechte einschraenken:
#
#   mkdir -p ~/.config/reachx-mta
#   cp credentials-vorlage.yaml ~/.config/reachx-mta/personio.yaml
#   chmod 600 ~/.config/reachx-mta/personio.yaml
#
# Der Pfad ist ueber die Umgebungsvariable REACHX_PERSONIO_CREDENTIALS
# ueberschreibbar. Die Datei gehoert NIEMALS ins Repo (.gitignore deckt sie ab).

# client_id und client_secret stammen aus Personio:
#   Einstellungen > Integrationen > API-Zugaenge > "Neue API-Zugangsdaten generieren"
# Erforderlich ist die Leseberechtigung fuer den Mitarbeiter-Endpunkt; fuer den
# Personalkosten-Teil zusaetzlich die Attribut-Freigabe fuer Gehaltsfelder
# (fix_salary, fix_salary_interval, hourly_salary, bonus oder das jeweilige
# Custom-Attribut). Ohne diese Freigabe liefert die API die Gehaltsfelder nicht.
client_id: "PUT-YOUR-CLIENT-ID-HERE"
client_secret: "PUT-YOUR-CLIENT-SECRET-HERE"

# Optional — nur setzen, wenn ein abweichender Personio-API-Host genutzt wird.
# Standard ist die deutsche Instanz.
base_url: "https://api.personio.de/v1"
