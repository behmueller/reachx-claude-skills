<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700;800;900&family=Red+Hat+Text:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-display: "Red Hat Display", sans-serif;
    --font-text: "Red Hat Text", sans-serif;
    --fw-regular: 400;
    --fw-medium: 500;
    --fw-semibold: 600;
    --fw-bold: 700;
    --fw-extrabold: 800;
    --fw-black: 900;

    --white: #fff;
    --night-sky-grey: #f2f3f3;
    --night-sky-dark-blue: #000a14;
    --sunrise-red: #ec644a;
    --sunrise-red-light: #ff8d6d;
    --sunrise-orange: #feae77;
    --sunrise-yellow: #fcd299;
    --sunrise-sand: #f5e1cc;
    --day-break-blue: #4a7ded;
    --day-break-blue-light: #e6edfc;
    --error: #bf4c4a;
    --approve: #66ae77;
    --approve-bg: #e4ece7;
    --gray-medium: #999da1;
    --gray-light: #d5d5d8;
    --gray-divider: #d9d9d9;
    --shadow: 0 0 24px 0 #0003;

    --fs-body: 1.0625rem;
    --lh-body: 1.53;
    --fs-h1: 1.125rem;
    --fs-h2: 1.75rem;
    --fs-h3: 1.5rem;
    --fs-h4: 1.375rem;
    --fs-h5: 1.25rem;
    --fs-h6: 1.125rem;
    --fs-small: 1rem;
    --fs-marginal: 0.875rem;
  }
  @media (min-width: 769px) {
    :root {
      --fs-body: 1.1875rem;
      --lh-body: 1.47;
      --fs-h1: 1.25rem;
      --fs-h2: 2.25rem;
      --fs-h3: 2rem;
      --fs-h4: 1.75rem;
      --fs-h5: 1.5rem;
      --fs-h6: 1.25rem;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 96px; -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-text);
    font-size: var(--fs-body);
    line-height: var(--lh-body);
    font-weight: var(--fw-regular);
    color: var(--night-sky-dark-blue);
    background: var(--night-sky-grey);
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1358px; margin: 0 auto; padding: 0 12px; }
  @media (min-width: 769px) { .container { padding: 0 48px; } }
  h1 { font-family: var(--font-text); font-weight: var(--fw-semibold); font-size: var(--fs-h1); line-height: 1.3; margin-bottom: 12px; }
  h2 { font-family: var(--font-display); font-weight: var(--fw-black); font-size: var(--fs-h2); line-height: 1.28; margin: 0; }
  h3 { font-family: var(--font-display); font-weight: var(--fw-extrabold); font-size: var(--fs-h4); line-height: 1.29; margin: 0 0 12px; }
  h4 { font-family: var(--font-text); font-weight: var(--fw-bold); font-size: var(--fs-marginal); line-height: 1.5; text-transform: uppercase; letter-spacing: 0.06em; color: var(--night-sky-dark-blue); margin: 24px 0 8px; }
  h4:first-child { margin-top: 0; }
  p { margin-bottom: 21px; }
  p:last-child { margin-bottom: 0; }
  strong { font-family: var(--font-text); font-weight: var(--fw-semibold); }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.92em; background: var(--night-sky-grey); padding: 1px 6px; border-radius: 3px; color: var(--night-sky-dark-blue); }
  a { color: var(--night-sky-dark-blue); font-weight: var(--fw-medium); border-bottom: 1px solid var(--night-sky-dark-blue); text-decoration: none; transition: border-bottom-color 0.35s, color 0.35s; }
  a:hover { border-bottom-color: transparent; color: var(--sunrise-red); }

  /* Hero */
  .hero { background: var(--white); padding: 48px 0 32px; border-bottom: 4px solid var(--sunrise-red); position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; top: 0; right: 0; width: 200px; height: 100%; background-image: repeating-linear-gradient(-48deg, var(--white) 0, var(--white) 30px, var(--night-sky-grey) 30px, var(--night-sky-grey) 60px); opacity: 0.6; pointer-events: none; }
  .hero .container { position: relative; }
  .hero .eyebrow { font-family: var(--font-text); font-size: var(--fs-marginal); font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: 0.08em; color: var(--sunrise-red); margin-bottom: 8px; }
  .hero .display { font-family: var(--font-display); font-weight: var(--fw-black); font-size: var(--fs-h2); line-height: 1.28; margin-bottom: 16px; color: var(--night-sky-dark-blue); }
  @media (min-width: 769px) { .hero { padding: 96px 0 64px; } .hero .display { font-size: 2.5rem; line-height: 1.3; } }
  .hero .meta { color: var(--night-sky-dark-blue); font-size: var(--fs-small); line-height: 1.5; max-width: 820px; }

  /* Stat-Strip */
  .stat-strip { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 32px; padding-top: 24px; border-top: 2px solid var(--night-sky-grey); }
  .stat { display: flex; flex-direction: column; }
  .stat .num { font-family: var(--font-display); font-weight: var(--fw-black); font-size: 2rem; line-height: 1; color: var(--sunrise-red); }
  .stat .lbl { font-family: var(--font-text); font-size: var(--fs-marginal); font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: 0.06em; color: var(--night-sky-dark-blue); margin-top: 4px; }
  .stat .sub { font-family: var(--font-text); font-size: var(--fs-marginal); font-weight: var(--fw-regular); color: var(--gray-medium); margin-top: 2px; }

  /* Main + Sections */
  main { padding: 48px 0 96px; }
  @media (min-width: 769px) { main { padding: 64px 0 144px; } }
  section { margin-bottom: 48px; }
  @media (min-width: 769px) { section { margin-bottom: 80px; } }
  section:last-child { margin-bottom: 0; }

  .section-heading { margin-bottom: 24px; }
  @media (min-width: 769px) { .section-heading { margin-bottom: 40px; } }
  .section-heading .label { font-family: var(--font-text); font-size: var(--fs-marginal); font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: 0.08em; color: var(--sunrise-red); margin-bottom: 8px; }
  .section-heading h2 { margin: 0; }
  .section-intro { max-width: 820px; margin-top: 16px; color: var(--night-sky-dark-blue); }

  /* Sticky-TOC */
  nav.toc { background: var(--white); box-shadow: var(--shadow); padding: 16px 24px; margin-bottom: 32px; position: sticky; top: 12px; z-index: 10; }
  @media (min-width: 769px) { nav.toc { padding: 24px 32px; margin-bottom: 48px; } }
  nav.toc strong { display: block; font-family: var(--font-text); font-size: var(--fs-marginal); font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: 0.08em; color: var(--sunrise-red); margin-bottom: 8px; }
  nav.toc a { color: var(--night-sky-dark-blue); font-weight: var(--fw-semibold); text-decoration: none; border-bottom: 1px solid var(--night-sky-dark-blue); margin-right: 20px; display: inline-block; padding: 2px 0; }

  /* Summary-Card */
  .summary-card { background: var(--white); box-shadow: var(--shadow); padding: 24px; margin-bottom: 24px; }
  @media (min-width: 769px) { .summary-card { padding: 40px 48px; } }
  .summary-card .note { margin-top: 21px; padding-top: 21px; border-top: 2px solid var(--night-sky-grey); color: var(--gray-medium); font-size: var(--fs-small); line-height: 1.5; }

  /* Ampel-Leiste — eine Karte je Audit-Modul */
  .ampel-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 16px 0; }
  @media (min-width: 769px) { .ampel-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
  .ampel-card { background: var(--white); box-shadow: var(--shadow); padding: 20px 24px; border-top: 6px solid var(--gray-divider); }
  .ampel-card[data-ampel="gruen"] { border-top-color: var(--approve); }
  .ampel-card[data-ampel="gelb"] { border-top-color: var(--sunrise-orange); }
  .ampel-card[data-ampel="rot"] { border-top-color: var(--error); }
  .ampel-card .modul { font-family: var(--font-text); font-size: var(--fs-marginal); font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray-medium); margin-bottom: 4px; }
  .ampel-card .urteil { font-family: var(--font-display); font-weight: var(--fw-extrabold); font-size: var(--fs-h5); }
  .ampel-card .detail { font-size: var(--fs-marginal); line-height: 1.45; margin-top: 6px; }

  /* Tabellen */
  table.data { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: var(--fs-small); background: var(--white); box-shadow: var(--shadow); }
  table.data th, table.data td { padding: 12px 16px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--gray-divider); }
  table.data th { background: var(--night-sky-grey); font-family: var(--font-text); font-weight: var(--fw-bold); font-size: var(--fs-marginal); text-transform: uppercase; letter-spacing: 0.05em; }
  table.data tr:last-child td { border-bottom: none; }
  table.data tr.total td { font-weight: var(--fw-bold); background: var(--night-sky-grey); border-top: 2px solid var(--night-sky-dark-blue); }

  /* Badges */
  .badge { display: inline-flex; align-items: center; font-family: var(--font-text); font-size: 0.75rem; font-weight: var(--fw-bold); padding: 4px 10px; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; line-height: 1.4; border-radius: 2px; }
  .badge.stark { background: var(--approve); color: var(--white); }
  .badge.mittel { background: var(--sunrise-orange); color: var(--night-sky-dark-blue); }
  .badge.schwach { background: var(--sunrise-red); color: var(--white); }
  .badge.neutral { background: var(--gray-divider); color: var(--night-sky-dark-blue); }

  /* Mini-Balken (Spend-Mix, Verteilungen) */
  .bar-row { display: flex; align-items: center; gap: 12px; margin: 8px 0; font-size: var(--fs-small); }
  .bar-row .bar-label { flex: 0 0 200px; font-weight: var(--fw-semibold); }
  .bar-row .bar-track { flex: 1; background: var(--night-sky-grey); height: 18px; position: relative; }
  .bar-row .bar-fill { height: 100%; background: var(--sunrise-red); }
  .bar-row .bar-val { flex: 0 0 90px; text-align: right; font-weight: var(--fw-semibold); }

  /* Expandable Cards */
  details.dim { background: var(--white); box-shadow: var(--shadow); margin-bottom: 16px; padding: 0; overflow: hidden; border-left: 6px solid var(--gray-divider); }
  details.dim[data-rating="stark"] { border-left-color: var(--approve); }
  details.dim[data-rating="mittel"] { border-left-color: var(--sunrise-orange); }
  details.dim[data-rating="schwach"] { border-left-color: var(--sunrise-red); }
  details.dim summary { padding: 20px 24px; cursor: pointer; list-style: none; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; user-select: none; transition: background 0.35s; }
  @media (min-width: 769px) { details.dim summary { padding: 24px 32px; gap: 16px; } }
  details.dim summary::-webkit-details-marker { display: none; }
  details.dim summary::after { content: "+"; margin-left: auto; font-family: var(--font-display); font-weight: var(--fw-bold); font-size: 1.5rem; line-height: 1; color: var(--sunrise-red); transition: transform 0.35s; flex-shrink: 0; }
  details.dim[open] summary::after { transform: rotate(45deg); }
  details.dim summary:hover { background: var(--night-sky-grey); }
  details.dim summary h3 { margin: 0; }
  details.dim .body { padding: 24px; border-top: 2px solid var(--night-sky-grey); background: var(--night-sky-grey); }
  @media (min-width: 769px) { details.dim .body { padding: 28px 32px 32px; } }

  /* Suggestion / Finding-Block */
  .suggestion { background: var(--night-sky-grey); border-left: 4px solid var(--sunrise-red); padding: 20px 24px; margin: 16px 0; }
  @media (min-width: 769px) { .suggestion { padding: 24px 32px; } }
  .suggestion .label { font-family: var(--font-text); font-size: var(--fs-marginal); font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: 0.06em; color: var(--sunrise-red); margin-bottom: 6px; }
  .suggestion.hoch { border-left-color: var(--error); }
  .suggestion.mittel { border-left-color: var(--sunrise-orange); }
  .suggestion.niedrig { border-left-color: var(--gray-medium); }

  /* Top-N Liste */
  ol.top3 { list-style: none; counter-reset: step; padding: 0; margin: 0; }
  ol.top3 li { counter-increment: step; background: var(--white); box-shadow: var(--shadow); padding: 24px 24px 24px 64px; margin-bottom: 16px; position: relative; }
  @media (min-width: 769px) { ol.top3 li { padding: 32px 48px 32px 96px; } }
  ol.top3 li::before { content: counter(step); position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; background: var(--sunrise-red); color: var(--white); font-family: var(--font-display); font-weight: var(--fw-bold); font-size: 1.25rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  @media (min-width: 769px) { ol.top3 li::before { width: 56px; height: 56px; font-size: 1.75rem; left: 20px; } }

  /* Disclaimer-Banner — Datenqualitäts-Vorbehalt */
  .disclaimer { background: var(--sunrise-sand); border: 2px solid var(--sunrise-orange); padding: 20px 24px; margin: 24px 0; font-size: var(--fs-small); }
  .disclaimer strong { color: #8a4520; }

  /* Footer */
  footer { background: var(--night-sky-dark-blue); color: var(--gray-medium); padding: 48px 0; margin-top: 96px; }
  footer p { color: var(--gray-medium); font-size: var(--fs-small); margin: 0; }
  footer a { color: var(--gray-medium); border-bottom: 1px solid var(--gray-medium); }
  footer a:hover { color: var(--white); border-bottom-color: var(--white); }

  /* Print */
  @media print {
    body { background: white; }
    .hero { padding: 24px 0; }
    .hero::before { display: none; }
    nav.toc { display: none; }
    main { padding: 24px 0 0; }
    section { margin-bottom: 32px; page-break-inside: avoid; }
    details.dim { box-shadow: none; border: 1px solid var(--gray-divider); border-left: 6px solid; page-break-inside: avoid; }
    details.dim summary::after { display: none; }
    details.dim[open] .body { display: block !important; }
    details > .body { display: block !important; }
    .summary-card, table.data, .ampel-card { box-shadow: none; border: 1px solid var(--gray-divider); }
    ol.top3 li { box-shadow: none; border: 1px solid var(--gray-divider); page-break-inside: avoid; }
    footer { background: white; color: var(--gray-medium); }
  }
</style>
</head>
<body>

<!--
  REPORT-MARKUP — kanonische Quelle: reference/report-output-schema.md
  Den Report-Koerper ausschliesslich aus den dort definierten Bausteinen
  zusammensetzen. Keine eigenen CSS-Klassen, kein inline-style (Ausnahme:
  bar-fill-Breite), dieser style-Block bleibt unveraendert.
-->

<header class="hero">
  <div class="container">
    <p class="eyebrow">{{EYEBROW}}</p>
    <h1 class="display">{{DISPLAY_NAME}}</h1>
    <p class="meta">{{META_LINE}}</p>
  </div>
</header>

<main>
<div class="container">

{{MAIN_CONTENT}}

</div>
</main>

<footer>
  <div class="container">
    <p>{{FOOTER_TEXT}}</p>
  </div>
</footer>

</body>
</html>
